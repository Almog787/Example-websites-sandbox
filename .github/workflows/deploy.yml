name: Deploy to GitHub Pages

on:
  # הפעלה אוטומטית בכל דחיפה (Push) לענף הראשי (main או master)
  push:
    branches: ["main", "master"]
  # מאפשר הפעלה ידנית של התהליך מכפתור ב-GitHub
  workflow_dispatch:

# הרשאות הנדרשות ל-GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# מניעת ריצה מקבילה של מספר פריסות על מנת למנוע התנגשויות
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
